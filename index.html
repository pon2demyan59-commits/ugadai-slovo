<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111216">
  <title>Угадай слово</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <section class="game-card">
      <h1>Угадай слово</h1>
      <section class="word-panel" aria-label="Подсказка">
        <form id="finalForm" class="final-form" autocomplete="off">
          <div class="final-entry" id="finalEntry">
            <div class="word-preview" id="wordPreview" aria-label="Угаданные буквы"></div>
            <input class="final-input" id="finalInput" type="text" inputmode="text"
              autocapitalize="none" spellcheck="false" autocomplete="off"
              aria-label="Последний шанс: введите недостающие буквы" hidden>
          </div>
          <p class="hint" id="hint">Подсказка к слову</p>
          <button id="finalSubmit" class="final-submit" type="submit" hidden>Проверить слово</button>
        </form>
      </section>
      <form class="guess-form" id="guessForm">
        <div class="board" id="board" aria-label="Четыре строки для ввода слова"></div>
        <div class="stats">
          <span>Попытка: <strong id="currentAttempt">1</strong></span>
          <span>Осталось: <strong id="attemptsLeft">4</strong></span>
        </div>
        <button id="checkButton" type="submit">Проверить</button>
      </form>
      <p class="message" id="message" aria-live="polite">У тебя 4 попытки угадать слово.</p>
      <section class="alphabet-panel" aria-label="Алфавит">
        <h2>АЛФАВИТ</h2>
        <div class="alphabet-grid" id="alphabet"></div>
        <div class="alphabet-legend">
          <span><i class="legend-dot legend-present"></i> Есть</span>
          <span><i class="legend-dot legend-correct"></i> На месте</span>
          <span><i class="legend-dot legend-missing"></i> Нет</span>
        </div>
      </section>
    </section>
    <div class="result-backdrop" id="resultBackdrop" hidden>
      <section class="result-banner" role="dialog" aria-modal="true"
        aria-labelledby="resultTitle" aria-describedby="resultText">
        <div class="result-ornament" aria-hidden="true">✦</div>
        <h2 id="resultTitle">Результат</h2>
        <p id="resultText"></p>
        <button type="button" id="nextWordButton">Следующее слово</button>
      </section>
    </div>
  </main>
  <script src="data/words.js"></script>
  <script src="script.js"></script>
</body>
</html>
