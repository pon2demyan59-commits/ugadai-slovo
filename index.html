<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Угадай слово</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <section class="game-card">
      <p class="game-label">Мобильная игра</p>
      <h1>Угадай слово</h1>

      <p class="hint" id="hint">Подсказка появится здесь</p>

      <div class="board" id="board"></div>

      <div class="stats">
        <span>Попытка: <strong id="currentAttempt">1</strong></span>
        <span>Осталось: <strong id="attemptsLeft">5</strong></span>
      </div>

      <form class="guess-form" id="guessForm">
        <input
          id="guessInput"
          type="text"
          autocomplete="off"
          placeholder="Напиши слово"
        >
        <button type="submit">Проверить</button>
      </form>

      <p class="message" id="message">У тебя 5 попыток угадать слово целиком.</p>

      <button class="new-game" id="newGameButton" type="button">Новая игра</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
