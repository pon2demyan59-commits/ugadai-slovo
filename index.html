<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111216">
  <title>Угадай слово</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <section class="game-card">
      <h1>Угадай слово</h1>
      <section class="word-panel" aria-label="Подсказка">
        <div class="word-preview" id="wordPreview"></div>
        <p class="hint" id="hint">Первая буква открыта</p>
      </section>
      <div class="board" id="board" aria-label="Игровое поле"></div>
      <div class="stats">
        <span>Попытка: <strong id="currentAttempt">1</strong></span>
        <span>Осталось: <strong id="attemptsLeft">5</strong></span>
      </div>
      <form class="guess-form" id="guessForm">
        <input id="guessInput" type="text" autocomplete="off" autocapitalize="none"
          spellcheck="false" placeholder="Введите слово" aria-label="Ваше слово">
        <button type="submit">Проверить</button>
      </form>
      <p class="message" id="message" aria-live="polite">У тебя 5 попыток угадать слово.</p>
      <button class="new-game" id="newGameButton" type="button">Новая игра</button>
      <section class="alphabet-panel" aria-label="Алфавит">
        <h2>АЛФАВИТ</h2>
        <div class="alphabet-grid" id="alphabet"></div>
        <div class="alphabet-legend">
          <span><i class="legend-dot legend-present"></i> Есть</span>
          <span><i class="legend-dot legend-correct"></i> На месте</span>
          <span><i class="legend-dot legend-missing"></i> Нет</span>
        </div>
      </section>
    </section>
  </main>
  <script src="data/words.js"></script>
  <script src="script.js"></script>
</body>
</html>
